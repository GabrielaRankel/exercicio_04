<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style_cad.css">
    <script src="../js/veiculo_cadastrar.js" defer></script>
    <title>Cadastro de Veiculo</title>
</head>
<body>
    <header>
        <nav><a href="../index.html">Home</a></nav>
        <br><hr><br>
    </header>
    <main>
        <h1>Cadastrar Veiculo</h1>
        <form>
            <label for="idCliente">Codigo do Cliente</label><br>
            <input type="text" id="idCliente" required><br><br>

            <label for="modelo">Modelo</label><br>
            <input type="text" id="modelo" required><br><br>

            <label for="marca">marca</label><br>
            <input type="text" id="marca" required><br><br>

            <label for="placa">Placa</label><br>
            <input type="number" id="placa" required><br><br>

            <label for="códigoRastreador">Código do Rastreador</label><br>
            <input type="number" id="códigoRastreador" required><br><br>

            <button id="btn_cadastrar">Cadastrar</button>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>
